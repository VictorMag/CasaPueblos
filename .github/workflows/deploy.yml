name: Build & Deploy

on:
  push:
    branches:
      - main        # producción → public_html/
      - preview     # staging    → public_html/preview/

  # Permite disparar el deploy manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build & Deploy (${{ github.ref_name }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Checkout del código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Node 20 (requerido por Astro 5)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias (usa package-lock.json exacto)
      - name: Install dependencies
        run: npm ci

      # 4. Si es la rama preview, sustituye site.ts con datos demo
      #    para que el cliente vea contenido real en lugar de placeholders.
      #    main siempre usa el site.ts original con datos reales.
      - name: Use preview data (branch preview only)
        if: github.ref_name == 'preview'
        run: cp src/config/site.preview.ts src/config/site.ts

      # 5. Build de producción
      #    preview usa PUBLIC_BASE=/preview/ para que Astro prefije correctamente
      #    todos los assets (CSS, JS, imágenes) con el subdirectorio de staging.
      - name: Build
        run: npm run build
        env:
          PUBLIC_BASE: ${{ github.ref_name == 'preview' && '/preview/' || '/' }}

      # 5b. En preview: reemplaza el .htaccess con la versión de staging
      #     (sin caché de LiteSpeed ni browser, para que los cambios sean visibles)
      - name: Use preview .htaccess (branch preview only)
        if: github.ref_name == 'preview'
        run: cp public/.htaccess.preview dist/.htaccess

      # 6. Deploy vía rsync sobre SSH
      #    main    → public_html/         (raíz del dominio)
      #    preview → public_html/preview/ (staging para el cliente)
      - name: Deploy to Hostinger via SSH/rsync
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # Configurar clave SSH
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # Agregar host a known_hosts para evitar prompt interactivo
          ssh-keyscan -p 65002 -H 195.35.39.122 >> ~/.ssh/known_hosts

          # Determinar carpeta destino según la rama
          if [ "${{ github.ref_name }}" = "main" ]; then
            SERVER_DIR="domains/casadelospueblosdelsur.org/public_html/"
          else
            SERVER_DIR="domains/casadelospueblosdelsur.org/public_html/preview/"
          fi

          # Subir dist/ al servidor (--delete elimina archivos que ya no existen)
          # El .htaccess de preview ya fue reemplazado por el de staging (sin caché)
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            ./dist/ \
            u638854670@195.35.39.122:$SERVER_DIR
